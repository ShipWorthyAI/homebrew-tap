name: Update Formula
run-name: Update ${{ inputs.formula }} for ${{ inputs.tag }}${{ inputs.request_id && format(' ({0})', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name
        required: true
        type: string
      tag:
        description: Release tag to update formula for
        required: true
        type: string
      version:
        description: Formula version override, used when the download tag is not v<version>
        required: false
        type: string
      repository:
        description: Source repository, for example ShipWorthyAI/brewlock
        required: true
        type: string
      macos_artifact:
        description: macOS release artifact name
        required: true
        type: string
      linux_artifact:
        description: Linux release artifact name
        required: false
        type: string
      request_id:
        description: Caller-generated ID used to identify this workflow run
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: macos-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v6

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update formula
        env:
          FORMULA: ${{ inputs.formula }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_ARTIFACT: ${{ inputs.linux_artifact }}
          MACOS_ARTIFACT: ${{ inputs.macos_artifact }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          args=(
            --formula "$FORMULA"
            --tag "$TAG"
            --repository "$REPOSITORY"
            --macos-artifact "$MACOS_ARTIFACT"
          )

          if [[ -n "$VERSION" ]]; then
            args+=(--version "$VERSION")
          fi

          if [[ -n "$LINUX_ARTIFACT" ]]; then
            args+=(--linux-artifact "$LINUX_ARTIFACT")
          fi

          python3 .github/scripts/update_formula.py "${args[@]}"

      - name: Commit and push
        run: |
          FORMULA="${{ inputs.formula }}"
          TAG="${{ inputs.tag }}"

          git add "Formula/${FORMULA}.rb"

          if git diff --cached --quiet; then
            echo "Formula/${FORMULA}.rb already up to date"
            exit 0
          fi

          git commit -m "${FORMULA}: update formula for ${TAG}"
          git push
